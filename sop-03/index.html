<!DOCTYPE html>
<html lang="en">
<head>
    <title>Traveller Details</title>
    <style>

#form {
    background-color: cyan;
    color: red;
    height: 500px;
    text-align: center;

}

.btn {
    height: 100px;
    width: 200px;
    object-fit:cover;
}

/*page3.html*/

#page2 {
    height: 300px;
    background-color: cyan;
    font-family: arial;
}

ul {
    color: orange;
}

.h1 {
    color: black;
}
    </style>
</head>
<body>
    <form id="form">
        <h1>Traveller Details</h1>
        Name of Traveller :-<input type="text" name="name" class="name" class="all" required><br><br>
        Date of travel :-<input type="date" name="date" class="date" required><br><br>
        Telephone No:-<input type="tel" name="phone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" class="tel" required><br><br>
        <input type="image" name="submit" src="submit_btn.png" alt="click here to submit" class="btn"><br><br>

        <a href="page1.html">Travellers Information</a>
    </form>
</body>
</html>
